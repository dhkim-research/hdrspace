<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- hdrspace logo B "fisheye": a 180-degree sky frame with the sun above the horizon.
       Canonical vector; tools/generate_hdrspace_icon.swift draws the same geometry
       (CoreGraphics, y up) and drawHdrspaceFisheyeMark in Hdrspace.cpp the in-app mark. -->
  <defs>
    <clipPath id="sky"><circle cx="512" cy="512" r="286"/></clipPath>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="597.8" cy="409" r="328.9">
      <stop offset="0" stop-color="#FFD68C" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#D69646" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#6E4620" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#181615" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="soil" gradientUnits="userSpaceOnUse" x1="512" y1="540.6" x2="512" y2="798">
      <stop offset="0" stop-color="#1E1D1E"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <radialGradient id="sun" gradientUnits="userSpaceOnUse" cx="597.8" cy="409" r="48.6">
      <stop offset="0" stop-color="#FFFAEC"/>
      <stop offset="0.62" stop-color="#FFF0CD"/>
      <stop offset="1" stop-color="#FFE2A0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="196" fill="#1B1C20" stroke="#35363B" stroke-width="3"/>
  <g clip-path="url(#sky)">
    <rect x="226" y="226" width="572" height="572" fill="#181615"/>
    <circle cx="512" cy="512" r="286" fill="url(#glow)"/>
    <path d="M222 609.24 Q512 540.6 802 609.24 L802 802 L222 802 Z" fill="url(#soil)"/>
    <circle cx="597.8" cy="409" r="48.6" fill="url(#sun)"/>
  </g>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#F4BF4F" stroke-width="28"/>
</svg>
