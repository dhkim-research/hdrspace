name: hdrspace Windows app

# Builds the hdrspace GUI for Windows with MSVC (like upstream tev), the mergehdr command-line
# tools with MSYS2/GCC, and puts them together with Radiance and a small POSIX shell (busybox)
# into one folder, then starts the app on the runner with software OpenGL (Mesa llvmpipe).
on:
  push:
    paths:
      - 'hdrspace/**'
      - 'mergehdr/**'
      - '.github/workflows/hdrspace-windows.yml'
  workflow_dispatch:

env:
  RADIANCE_RELEASE: "39b99660"

jobs:
  app:
    runs-on: windows-2022
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: ilammy/setup-nasm@v1

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Libraries from vcpkg (FFTW, Eigen)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "fftw3[threads]" eigen3 --triplet x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S hdrspace -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --target hdrspace -- -k 0 2>&1 | Tee-Object -FilePath build-log.txt -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Error summary
        if: failure()
        shell: pwsh
        run: |
          "## Build errors (first 200)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path build-log.txt) {
            Select-String -Path build-log.txt -Pattern ': (fatal )?error |CMake Error|error LNK' | Select-Object -First 200 | ForEach-Object { $_.Line } | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdrspace-windows-build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Stage the app (exe, runtime DLLs, resources)
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force "$stage/bin", "$stage/Resources/hdrvdp3/data", "$stage/Resources/licenses", "$stage/Resources/branding", "$stage/profiles" | Out-Null
          Copy-Item build/hdrspace.exe "$stage/bin/"
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" "$stage/bin/"
          $redist = "$env:VCToolsRedistDir/x64"
          # C++ runtime and the OpenMP runtime (vcomp140); the /openmp:llvm runtime is not redistributable
          Get-ChildItem $redist -Directory | Where-Object { $_.Name -like "Microsoft.VC*.CRT" -or $_.Name -like "Microsoft.VC*.OpenMP" } |
            ForEach-Object { Copy-Item "$($_.FullName)/*.dll" "$stage/bin/" }
          Copy-Item hdrspace/assets/hdrvdp3-data/* "$stage/Resources/hdrvdp3/data/" -Recurse
          Copy-Item hdrspace/assets/licenses/* "$stage/Resources/licenses/" -Recurse
          Copy-Item hdrspace/assets/branding/hdrspace_icon_1024.png, hdrspace/assets/branding/hdrspace.svg "$stage/Resources/branding/"
          Copy-Item mergehdr/profiles/* "$stage/profiles/" -Recurse
          dumpbin /dependents build/hdrspace.exe | Select-String "\.dll"
          Get-ChildItem "$stage/bin" | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: app-stage
          path: stage/

  mergehdr:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-libraw mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-openexr mingw-w64-ucrt-x86_64-imath mingw-w64-ucrt-x86_64-exiv2
            mingw-w64-ucrt-x86_64-eigen3 mingw-w64-ucrt-x86_64-boost mingw-w64-ucrt-x86_64-fftw
      - name: Build and package mergehdr
        run: |
          boost_version=$(pacman -Q mingw-w64-ucrt-x86_64-boost | awk '{print $2}' | cut -d- -f1)
          cmake -S mergehdr -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_STANDARD=17 \
            -DCMAKE_C_EXTENSIONS=ON -DMERGEHDR_BOOST_MIN_VERSION="$boost_version"
          cmake --build build --target mergehdr mergehdrcore
          pkg=pkg/mergehdr
          mkdir -p "$pkg/bin"
          cp build/mergehdr.exe build/mergehdrcore.exe "$pkg/bin/"
          for exe in "$pkg"/bin/*.exe; do ldd "$exe"; done | awk '/\/ucrt64\// {print $3}' | sort -u \
            | while read -r dll; do cp "$dll" "$pkg/bin/"; done
          cp -r mergehdr/profiles mergehdr/hdrvdp3 "$pkg/"
          cp mergehdr/COPYING mergehdr/COPYING.LESSER mergehdr/THIRD_PARTY_NOTICES.rst "$pkg/"
      - uses: actions/upload-artifact@v4
        with:
          name: mergehdr-cli
          path: pkg/

  package:
    needs: [app, mergehdr]
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-stage
          path: hdrspace-windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: mergehdr-cli
          path: hdrspace-windows-x64/tools

      - name: Radiance and busybox
        shell: pwsh
        run: |
          $root = "hdrspace-windows-x64"
          $rel = $env:RADIANCE_RELEASE
          Invoke-WebRequest "https://github.com/LBNL-ETA/Radiance/releases/download/$rel/Radiance_${rel}_Windows.zip" -OutFile radiance.zip
          Expand-Archive radiance.zip -DestinationPath radiance-zip
          Get-ChildItem radiance-zip -Depth 2 | Select-Object FullName | Format-Table -AutoSize | Out-String -Width 300
          $bin = Get-ChildItem radiance-zip -Recurse -Directory -Filter bin | Select-Object -First 1
          $lib = Get-ChildItem radiance-zip -Recurse -Directory -Filter lib | Select-Object -First 1
          New-Item -ItemType Directory -Force "$root/Resources/radiance" | Out-Null
          Copy-Item $bin.FullName "$root/Resources/radiance/bin" -Recurse
          Copy-Item $lib.FullName "$root/Resources/radiance/lib" -Recurse
          Get-ChildItem radiance-zip -Recurse -File | Where-Object { $_.Name -match '^(License|LICENSE|COPYRIGHT)' } |
            Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName "$root/Resources/licenses/Radiance-$($_.Name)" }
          # busybox-w32 (GPL-2.0): the POSIX shell that runs hdrspace's command lines on Windows
          Invoke-WebRequest "https://frippery.org/files/busybox/busybox64u.exe" -OutFile "$root/bin/busybox.exe"
          @(
            "busybox-w32 (https://frippery.org/busybox/), GPL-2.0.",
            "Source code: https://frippery.org/files/busybox/ and https://github.com/rmyorston/busybox-w32"
          ) | Out-File "$root/Resources/licenses/busybox-w32.txt" -Encoding utf8
          & "$root/bin/busybox.exe" sh -c "echo busybox shell ok; ls '$((Resolve-Path $root/Resources/radiance/bin).Path)' | head -5"

      - name: Read me
        shell: pwsh
        run: |
          @(
            "hdrspace for Windows (preview build)",
            "",
            "Start bin\hdrspace.exe. Keep the folder together: the app finds mergehdr in tools\mergehdr,",
            "Radiance in Resources\radiance and the shell it uses for jobs (bin\busybox.exe) by their",
            "place in this folder.",
            "",
            "Not available on Windows yet: AI Segmentation and View Volume (SAM 3, Depth Anything 3),",
            "and the pfstools tone-mapping operators (Radiance pcond works)."
          ) | Out-File hdrspace-windows-x64/README-Windows.txt -Encoding utf8
          Get-ChildItem hdrspace-windows-x64 -Recurse -File | Measure-Object -Property Length -Sum | ForEach-Object { "files: $($_.Count), MB: $([math]::Round($_.Sum/1MB,1))" }

      - uses: actions/upload-artifact@v4
        with:
          name: hdrspace-windows-x64
          path: hdrspace-windows-x64/

      # The runner has no GPU; Mesa's software OpenGL (llvmpipe) is put next to a copy of the
      # app only for this check. Opens a test picture and takes a screenshot of the desktop.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            mergehdr/tests/crossplatform/data
            .github/scripts
          path: src
      - name: Package self-test (shell jobs, mergehdr, Radiance)
        shell: pwsh
        run: |
          # The app runs its jobs as POSIX command lines in bin\busybox.exe; do the same here.
          $root = (Resolve-Path hdrspace-windows-x64).Path
          $data = (Resolve-Path src/mergehdr/tests/crossplatform/data).Path
          New-Item -ItemType Directory -Force selftest | Out-Null
          $work = (Resolve-Path selftest).Path
          $script = @"
          set -e
          export PATH='$root\Resources\radiance\bin;'"`$PATH"
          export RAYPATH='$root\Resources\radiance\lib'
          cd '$work'
          cp '$data\a47.hdr' 'a47 copy.hdr'
          '$root\tools\mergehdr\bin\mergehdr.exe' evalglare 'a47 copy.hdr' > glare.txt
          getinfo -d 'a47 copy.hdr'
          pfilt -1 -x /2 -y /2 'a47 copy.hdr' > half.hdr && getinfo -d half.hdr
          pcond -h 'a47 copy.hdr' > pcond.hdr && getinfo -d pcond.hdr
          echo "evalglare: `$(cat glare.txt)"
          "@
          & "$root/bin/busybox.exe" sh -c $script
          if ($LASTEXITCODE -ne 0) { throw "self-test failed" }

      - name: Start the app (software OpenGL) and take a screenshot
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z" -OutFile mesa.7z
          7z x mesa.7z -omesa | Out-Null
          Copy-Item -Recurse hdrspace-windows-x64 smoke
          Copy-Item mesa/x64/*.dll smoke/bin/
          $env:GALLIUM_DRIVER = "llvmpipe"
          $picture = (Resolve-Path src/mergehdr/tests/crossplatform/data/a47.hdr).Path
          $app = Start-Process smoke/bin/hdrspace.exe -ArgumentList "`"$picture`"" -PassThru `
            -RedirectStandardOutput smoke-stdout.txt -RedirectStandardError smoke-stderr.txt
          Start-Sleep -Seconds 30
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -Namespace Win -Name Mouse -MemberDefinition @"
          [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
          [DllImport("user32.dll")] public static extern void mouse_event(int flags, int dx, int dy, int data, int extra);
          "@
          New-Item -ItemType Directory -Force smoke-result | Out-Null
          function Shot($name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("$pwd/smoke-result/$name.png")
          }
          function Click($x, $y, $wait) {
            [Win.Mouse]::SetCursorPos($x, $y) | Out-Null
            Start-Sleep -Milliseconds 400
            [Win.Mouse]::mouse_event(2, 0, 0, 0, 0); Start-Sleep -Milliseconds 80; [Win.Mouse]::mouse_event(4, 0, 0, 0, 0)
            Start-Sleep -Seconds $wait
          }
          Shot "screenshot"
          # Positions on the 1024 x 768 runner screen
          Click 61 389 4;   Click 810 689 25; Shot "glare"        # Glare -> Analyze
          Click 760 595 3;  Shot "glare-source7"                  # select glare source 7
          Click 89 517 4;   Click 815 687 40; Shot "perceptual"   # Perceptual maps -> Compute map
          Click 80 131 6;   Shot "tonemapping"
          Click 78 637 6;   Shot "createview"
          "still running after 30 s: $(-not $app.HasExited)" | Tee-Object smoke-result/status.txt
          if ($app.HasExited) { "exit code: $($app.ExitCode)" | Tee-Object smoke-result/status.txt -Append }
          Copy-Item smoke-stdout.txt, smoke-stderr.txt smoke-result/ -ErrorAction SilentlyContinue
          Get-Content smoke-stderr.txt -ErrorAction SilentlyContinue | Select-Object -First 80
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
      - name: GUI check (Korean file name, every tool, Export image)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:GALLIUM_DRIVER = "llvmpipe"
          New-Item -ItemType Directory -Force "gui 테스트", gui-result, C:\guiout | Out-Null
          Copy-Item src/mergehdr/tests/crossplatform/data/a47.hdr "gui 테스트/한글 그림.hdr"
          $picture = (Resolve-Path "gui 테스트/한글 그림.hdr").Path
          $app = Start-Process smoke/bin/hdrspace.exe -ArgumentList "`"$picture`"" -PassThru `
            -RedirectStandardOutput gui-stdout.txt -RedirectStandardError gui-stderr.txt
          Start-Sleep -Seconds 30
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -Namespace Win -Name Mouse -MemberDefinition @"
          [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
          [DllImport("user32.dll")] public static extern void mouse_event(int flags, int dx, int dy, int data, int extra);
          "@
          function Shot($name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("$pwd/gui-result/$name.png")
          }
          function Click($x, $y, $wait) {
            [Win.Mouse]::SetCursorPos($x, $y) | Out-Null
            Start-Sleep -Milliseconds 400
            [Win.Mouse]::mouse_event(2, 0, 0, 0, 0); Start-Sleep -Milliseconds 80; [Win.Mouse]::mouse_event(4, 0, 0, 0, 0)
            Start-Sleep -Seconds $wait
          }
          # Types any text (also Korean) as Unicode key events
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public static class Typer {
            [StructLayout(LayoutKind.Sequential)] struct MOUSEINPUT { public int dx, dy; public uint mouseData, dwFlags, time; public IntPtr extra; }
            [StructLayout(LayoutKind.Sequential)] struct KEYBDINPUT { public ushort wVk, wScan; public uint dwFlags, time; public IntPtr extra; }
            [StructLayout(LayoutKind.Explicit)] struct U { [FieldOffset(0)] public MOUSEINPUT mi; [FieldOffset(0)] public KEYBDINPUT ki; }
            [StructLayout(LayoutKind.Sequential)] struct INPUT { public uint type; public U u; }
            [DllImport("user32.dll")] static extern uint SendInput(uint n, INPUT[] inputs, int size);
            public static void Type(string s) {
              foreach (char c in s) {
                var a = new INPUT[2];
                a[0].type = 1; a[0].u.ki.wScan = c; a[0].u.ki.dwFlags = 4;
                a[1].type = 1; a[1].u.ki.wScan = c; a[1].u.ki.dwFlags = 6;
                SendInput(2, a, Marshal.SizeOf(typeof(INPUT)));
                System.Threading.Thread.Sleep(15);
              }
            }
          }
          "@
          function Export($typed, $name) {
            try {
              Click 847 27 6; Shot "$name-dialog"
              [System.Windows.Forms.SendKeys]::SendWait("^a"); [Typer]::Type($typed)
              Start-Sleep -Seconds 1; Shot "$name-typed"
              [System.Windows.Forms.SendKeys]::SendWait("{ENTER}"); Start-Sleep -Seconds 10; Shot "$name-after"
            } catch { "export $name failed: $_" | Tee-Object -Append gui-result/status.txt }
          }
          Shot "00-korean-name"
          # Export image from the Viewer (Export image is at 847,27 on the 1024 x 768 screen)
          Export "C:\guiout\export.exr" "01-exr"
          Export "C:\guiout\export.hdr" "02-hdr"
          Export "C:\guiout\export.png" "03-png"
          Export "C:\guiout\내보내기.exr" "04-korean-exr"
          # every tool in the rail, then the help and settings buttons
          $tools = @(@("10-viewer",65,99), @("11-tonemapping",80,131), @("12-merge",75,191), @("13-calibrate",70,223),
                     @("14-crop",91,297), @("15-blur",58,329), @("16-glare",61,389), @("17-statistics",72,421),
                     @("18-viewvisibility",83,453), @("19-viewvolume",80,485), @("20-perceptual",89,517),
                     @("21-aisegmentation",89,577), @("22-createview",78,637))
          foreach ($t in $tools) { Click $t[1] $t[2] 5; Shot $t[0] }
          Click 65 99 3
          Click 962 27 4; Shot "30-help"; [System.Windows.Forms.SendKeys]::SendWait("{ESC}"); Start-Sleep 2
          Click 928 27 4; Shot "31-settings"; [System.Windows.Forms.SendKeys]::SendWait("{ESC}"); Start-Sleep 2
          "app still running: $(-not $app.HasExited)" | Tee-Object gui-result/status.txt
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Get-ChildItem C:\guiout | Format-Table Name, Length | Out-String | Tee-Object gui-result/files.txt
          Copy-Item C:\guiout\* gui-result/ -ErrorAction SilentlyContinue
          Copy-Item gui-stdout.txt, gui-stderr.txt gui-result/ -ErrorAction SilentlyContinue
          python -m pip install --quiet OpenEXR numpy
          $exported = @(Get-ChildItem C:\guiout -Include *.exr,*.hdr -Recurse | ForEach-Object { $_.FullName })
          python src/.github/scripts/check_export.py "$picture" @exported 2>&1 | Tee-Object gui-result/check.txt
      - name: GUI workflows (Tonemapping Ward, View Visibility, Merge HDR, Create View)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:GALLIUM_DRIVER = "llvmpipe"
          New-Item -ItemType Directory -Force gui-flow, C:\raw, C:\scene, C:\vv | Out-Null
          # test data: the R5m2 RAW bracket from the release, a white mask, a small Radiance room
          Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/download/crossplatform-raw-data/raw-bracket.zip" -OutFile raw.zip
          Expand-Archive raw.zip -DestinationPath rawzip
          Get-ChildItem rawzip -Recurse -Filter *.CR3 | Copy-Item -Destination C:\raw
          $raws = @(Get-ChildItem C:\raw -Filter *.CR3 | Sort-Object Name | ForEach-Object { $_.Name })
          "RAW files: $raws" | Tee-Object gui-flow/status.txt
          Copy-Item src/.github/scripts/scene/* C:\scene
          Copy-Item src/mergehdr/tests/crossplatform/data/a47.hdr, src/mergehdr/tests/crossplatform/data/a64.hdr C:\vv
          $rad = (Resolve-Path hdrspace-windows-x64/Resources/radiance/bin).Path
          cmd /c "`"$rad\pcomb.exe`" -e `"ro=1;go=1;bo=1`" -x 512 -y 512 > C:\vv\white.hdr"
          Get-ChildItem C:\vv | Format-Table Name, Length | Out-String | Tee-Object -Append gui-flow/status.txt

          $app = Start-Process smoke/bin/hdrspace.exe -ArgumentList "C:\vv\a47.hdr" -PassThru `
            -RedirectStandardOutput flow-stdout.txt -RedirectStandardError flow-stderr.txt
          Start-Sleep -Seconds 30
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -Namespace Win -Name Mouse -MemberDefinition @"
          [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
          [DllImport("user32.dll")] public static extern void mouse_event(int flags, int dx, int dy, int data, int extra);
          "@
          function Shot($name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("$pwd/gui-flow/$name.png")
          }
          function Click($x, $y, $wait) {
            [Win.Mouse]::SetCursorPos($x, $y) | Out-Null
            Start-Sleep -Milliseconds 400
            [Win.Mouse]::mouse_event(2, 0, 0, 0, 0); Start-Sleep -Milliseconds 80; [Win.Mouse]::mouse_event(4, 0, 0, 0, 0)
            Start-Sleep -Seconds $wait
          }
          # a message box shows a yellow OK button over the canvas: take a picture, then click it
          function Dismiss($name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $xs = @(); $ys = @()
            for ($y = 250; $y -lt 520; $y += 4) {
              for ($x = 250; $x -lt 720; $x += 4) {
                $c = $bitmap.GetPixel($x, $y)
                if ($c.R -gt 225 -and $c.G -gt 165 -and $c.G -lt 215 -and $c.B -lt 110) { $xs += $x; $ys += $y }
              }
            }
            if ($xs.Count -gt 20) {
              $bitmap.Save("$pwd/gui-flow/$name-dialog.png")
              $cx = [int](($xs | Measure-Object -Average).Average); $cy = [int](($ys | Measure-Object -Average).Average)
              "${name}: message box, OK clicked at $cx,$cy" | Tee-Object -Append gui-flow/status.txt
              Click $cx $cy 2
            }
          }
          function Keys($k) { [System.Windows.Forms.SendKeys]::SendWait($k); Start-Sleep -Milliseconds 500 }
          function Step($name, [scriptblock]$body) {
            try { & $body } catch { "step $name failed: $_" | Tee-Object -Append gui-flow/status.txt }
          }
          # wait until a new file matching $pattern appears (or $seconds pass)
          function WaitFile($pattern, $seconds) {
            for ($i = 0; $i -lt $seconds; $i += 5) {
              $f = Get-ChildItem $pattern -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($f) { Start-Sleep -Seconds 3; return $f }
              Start-Sleep -Seconds 5
            }
            return $null
          }

          Step "tonemapping" {
            Click 80 131 5; Shot "t1-tonemapping"            # the only operator tile on Windows: Ward '97
            Click 790 199 30; Shot "t2-ward-preview"; Dismiss "t2"
            Click 806 689 30; Shot "t3-ward-full"; Dismiss "t3"
            $p = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter "*-ward97-*.bmp" -ErrorAction SilentlyContinue | Select-Object -First 3
            "ward previews: $($p.FullName)" | Tee-Object -Append gui-flow/status.txt
            $p | Copy-Item -Destination gui-flow/ -ErrorAction SilentlyContinue
          }
          Step "view-visibility" {
            Dismiss "v0"; Click 83 453 5; Shot "v1-panel"
            Click 900 198 1; Keys "^a"; Keys "C:\vv\a47.hdr{ENTER}"
            Click 900 236 1; Keys "^a"; Keys "C:\vv\a64.hdr{ENTER}"
            Click 900 274 1; Keys "^a"; Keys "C:\vv\white.hdr{ENTER}"
            Shot "v2-paths"
            Click 790 312 15; Shot "v3-loaded"
            Click 868 689 120; Shot "v4-computed"; Dismiss "v4"
          }
          Step "merge-hdr" {
            Dismiss "m0"; Click 75 191 5; Shot "m1-panel"
            Click 861 172 6; Shot "m2-dialog"
            Keys "^a"; Keys "C:\raw{ENTER}"; Start-Sleep -Seconds 2
            Keys ("^a" + (($raws | ForEach-Object { "`"$_`"" }) -join " ") + "{ENTER}"); Start-Sleep -Seconds 4
            Shot "m3-files"
            Click 868 689 5; Shot "m4-running"
            $out = WaitFile "C:\raw\*.hdr" 420
            Shot "m5-done"; Dismiss "m5"
            "merge output: $out" | Tee-Object -Append gui-flow/status.txt
          }
          Step "create-view" {
            Dismiss "c0"; Click 78 637 5; Shot "c1-panel"
            Click 798 206 6; Keys "^a"; Keys "C:\scene\room.rad{ENTER}"; Start-Sleep -Seconds 4
            Click 798 338 6; Keys "^a"; Keys "C:\scene\view.vf{ENTER}"; Start-Sleep -Seconds 6
            Shot "c2-loaded"
            Click 632 410 60; Shot "c3-preview"; Dismiss "c3"
            Click 806 687 5; Shot "c4-render-started"
            $r = WaitFile "C:\scene\*.hdr" 300
            Shot "c5-render-done"; Dismiss "c5"
            "create view output: $r" | Tee-Object -Append gui-flow/status.txt
          }
          "app still running: $(-not $app.HasExited)" | Tee-Object -Append gui-flow/status.txt
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Copy-Item flow-stdout.txt, flow-stderr.txt gui-flow/ -ErrorAction SilentlyContinue
          Get-ChildItem C:\raw, C:\scene, C:\vv | Format-Table FullName, Length | Out-String | Tee-Object -Append gui-flow/status.txt

          # headers and pixel statistics of what the GUI wrote
          python -m pip install --quiet numpy
          Start-Sleep -Seconds 20
          $outputs = @(Get-ChildItem C:\raw\*.hdr, C:\scene\*.hdr -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          foreach ($o in $outputs) {
            python -c "import sys; d=open(sys.argv[1],'rb').read(65536); print(sys.argv[1]); print(d.split(b'\n\n')[0].decode('latin1'))" $o | Tee-Object -Append gui-flow/headers.txt
            python src/.github/scripts/compare_hdr.py $o $o 2>&1 | Tee-Object -Append gui-flow/headers.txt
          }
          Get-ChildItem C:\scene\*.hdr -ErrorAction SilentlyContinue | Copy-Item -Destination gui-flow/
          Get-ChildItem C:\raw\*.hdr -ErrorAction SilentlyContinue | Copy-Item -Destination gui-flow/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            smoke-result/
            gui-result/
            gui-flow/
